name: LocalPro CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. Backend Continuous Integration & Tests
  # ==========================================
  server-ci:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Build TypeScript Server
        run: npm run build

      - name: Run Jest & Supertest Integration Suites
        run: npm test

  # ==========================================
  # 2. Frontend Continuous Integration
  # ==========================================
  client-ci:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Verify TypeScript & Vite Build
        run: npm run build

  # ==========================================
  # 3. Docker Image Build Verification
  # ==========================================
  docker-validation:
    name: Docker Multi-Stage Image Build
    runs-on: ubuntu-latest
    needs: [server-ci, client-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: localpro-server:latest

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: localpro-client:latest

  # ==========================================
  # 4. Automated 24/7 GitHub Pages Deployment (Free, 0 Card)
  # ==========================================
  deploy-pages:
    name: Deploy to GitHub Pages (24/7 Free)
    runs-on: ubuntu-latest
    needs: [client-ci]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Build Client for GitHub Pages
        run: |
          cd client
          npm run build
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist

